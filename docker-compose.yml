services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantum}
      POSTGRES_DB: ${POSTGRES_DB:-quantum_learn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum} -d ${POSTGRES_DB:-quantum_learn}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    # .env only OVERRIDES the ${VAR:-defaults} below; a fresh clone must be
    # able to `make up` before anyone has copied .env.example (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quantum:quantum@postgres:5432/quantum_learn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QBRAID_API_KEY: ${QBRAID_API_KEY:-}
      QBRAID_DEVICE_ID: ${QBRAID_DEVICE_ID:-}
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - ./samples:/samples:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    # .env only OVERRIDES the ${VAR:-defaults} below; a fresh clone must be
    # able to `make up` before anyone has copied .env.example (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quantum:quantum@postgres:5432/quantum_learn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QBRAID_API_KEY: ${QBRAID_API_KEY:-}
      QBRAID_DEVICE_ID: ${QBRAID_DEVICE_ID:-}
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - ./samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # the api service owns migrations; the worker just waits for the schema
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  # The React SPA is the only UI. Static bundle + /api proxy via its own
  # nginx, so the browser stays same-origin and CORS is a dev-only detail.
  # The dist is BAKED into the image (no bind mount): `make up` rebuilds this
  # service's image only when frontend/web sources change, and a fresh clone
  # works with zero host tooling.
  web:
    build:
      # Context is ./frontend, not ./frontend/web, because the drag-and-drop
      # grid lives in frontend/circuit_composer and is shared with this app
      # (see the @composer alias in frontend/web/vite.config.ts).
      context: ./frontend
      dockerfile: web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
