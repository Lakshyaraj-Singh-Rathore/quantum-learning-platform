services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantum}
      POSTGRES_DB: ${POSTGRES_DB:-quantum_learn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum} -d ${POSTGRES_DB:-quantum_learn}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    # .env only OVERRIDES the ${VAR:-defaults} below; a fresh clone must be
    # able to `make up` before anyone has copied .env.example (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quantum:quantum@postgres:5432/quantum_learn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QBRAID_API_KEY: ${QBRAID_API_KEY:-}
      QBRAID_DEVICE_ID: ${QBRAID_DEVICE_ID:-}
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - ./samples:/samples:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    # .env only OVERRIDES the ${VAR:-defaults} below; a fresh clone must be
    # able to `make up` before anyone has copied .env.example (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://quantum:quantum@postgres:5432/quantum_learn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QBRAID_API_KEY: ${QBRAID_API_KEY:-}
      QBRAID_DEVICE_ID: ${QBRAID_DEVICE_ID:-}
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - ./samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # the api service owns migrations; the worker just waits for the schema
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  streamlit:
    build:
      context: ./frontend
    # .env only OVERRIDES the ${VAR:-defaults} below; a fresh clone must be
    # able to `make up` before anyone has copied .env.example (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: ${STREAMLIT_API_URL:-http://api:8000}
      PYTHONPATH: /backend
    volumes:
      - ./frontend:/app
      # keep the composer bundle baked into the image visible under the bind mount
      - /app/circuit_composer/frontend/build
      - ./backend:/backend:ro
      - ./content:/content:ro
      - ./samples:/samples:ro
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run Home.py --server.address 0.0.0.0 --server.port 8501

  # The new React SPA (docs/UI_REDESIGN_PLAN.md, phase P0). Static bundle +
  # /api proxy via its own nginx, so the browser stays same-origin and CORS
  # is a dev-only detail. The dist is BAKED into the image (no bind mount):
  # `make up` rebuilds this service's image only when frontend/web sources
  # change, and a fresh clone works with zero host tooling. The frozen
  # Streamlit app keeps :8501 until the parity cutover (P8).
  web:
    build:
      context: ./frontend/web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
