<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>QuantumLearn</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%233dd6c6' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%233dd6c6'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so a light-mode user never sees a dark
      // flash (and vice versa). Keys must match state/theme.ts.
      try {
        var s = JSON.parse(localStorage.getItem("ql-theme") || "{}");
        var mode = (s.state && s.state.theme) || "dark";
        document.documentElement.classList.toggle("dark", mode !== "light");
      } catch (e) {
        /* dark stays on the html class already set above */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
