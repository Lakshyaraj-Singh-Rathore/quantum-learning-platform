# The SPA is same-origin with the API: /api/* is proxied to the compose
# service and the /api prefix stripped, exactly like vite's dev proxy.
# The browser never learns a port for the backend, so nothing here depends
# on CORS (the API's CORS middleware stays a dev convenience, not a
# deployment requirement).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy.
    #
    # 'unsafe-inline' in style-src is not laziness: React applies styles through
    # the style attribute, which style-src governs, so a policy without it
    # silently unstyles the entire app. Scripts get no such allowance -- every
    # script is a content-hashed bundle from /assets.
    #
    # connect-src is 'self' on purpose: the SPA only ever talks to /api, which
    # this server proxies. A browser that can be talked into fetching an
    # arbitrary origin has nothing useful to steal here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # React Router owns client-side paths; unknown URLs get the shell,
    # which decides (login / 404 / redirect).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets are content-hashed by Vite — cache hard, cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
